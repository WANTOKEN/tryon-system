<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="translate(40, 40)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="url(#bgGradient)"/>
    
    <g transform="scale(0.6)">
      <path d="M0,-50 
               C-8,-50 -15,-45 -15,-38 
               L-15,-30 
               C-15,-25 -12,-22 -8,-22 
               L-8,-15 
               L-25,-5 
               C-30,-2 -32,3 -30,8 
               L-20,35 
               C-18,40 -15,42 -10,42 
               L-8,42 
               L-8,55 
               C-8,58 -5,60 0,60 
               C5,60 8,58 8,55 
               L8,42 
               L10,42 
               C15,42 18,40 20,35 
               L30,8 
               C32,3 30,-2 25,-5 
               L8,-15 
               L8,-22 
               C12,-22 15,-25 15,-30 
               L15,-38 
               C15,-45 8,-50 0,-50 Z" 
            fill="white" 
            opacity="0.95"/>
      
      <path d="M-12,-35 
               C-12,-38 -8,-40 0,-40 
               C8,-40 12,-38 12,-35 
               C12,-32 8,-30 0,-30 
               C-8,-30 -12,-32 -12,-35 Z" 
            fill="url(#accentGradient)" 
            opacity="0.8"/>
      
      <g filter="url(#glow)">
        <circle cx="-35" cy="-30" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="35" cy="-30" r="4" fill="#fff" opacity="0.9"/>
        <circle cx="-40" cy="0" r="3" fill="#fff" opacity="0.7"/>
        <circle cx="40" cy="0" r="3" fill="#fff" opacity="0.7"/>
        <circle cx="-35" cy="25" r="3.5" fill="#fff" opacity="0.8"/>
        <circle cx="35" cy="25" r="3.5" fill="#fff" opacity="0.8"/>
      </g>
    </g>
  </g>
  
  <text x="90" y="50" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="url(#bgGradient)">
    AI TryOn
  </text>
  
  <text x="90" y="68" 
        font-family="Arial, sans-serif" 
        font-size="11" 
        fill="#764ba2" 
        opacity="0.8">
    虚拟试衣系统
  </text>
</svg>