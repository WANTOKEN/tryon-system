<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#bgGradient)"/>
  
  <g transform="translate(100, 100)">
    <path d="M0,-50 
             C-8,-50 -15,-45 -15,-38 
             L-15,-30 
             C-15,-25 -12,-22 -8,-22 
             L-8,-15 
             L-25,-5 
             C-30,-2 -32,3 -30,8 
             L-20,35 
             C-18,40 -15,42 -10,42 
             L-8,42 
             L-8,55 
             C-8,58 -5,60 0,60 
             C5,60 8,58 8,55 
             L8,42 
             L10,42 
             C15,42 18,40 20,35 
             L30,8 
             C32,3 30,-2 25,-5 
             L8,-15 
             L8,-22 
             C12,-22 15,-25 15,-30 
             L15,-38 
             C15,-45 8,-50 0,-50 Z" 
          fill="white" 
          opacity="0.95"/>
    
    <path d="M-12,-35 
             C-12,-38 -8,-40 0,-40 
             C8,-40 12,-38 12,-35 
             C12,-32 8,-30 0,-30 
             C-8,-30 -12,-32 -12,-35 Z" 
          fill="url(#accentGradient)" 
          opacity="0.8"/>
    
    <g filter="url(#glow)">
      <circle cx="-35" cy="-30" r="4" fill="#fff" opacity="0.9"/>
      <circle cx="35" cy="-30" r="4" fill="#fff" opacity="0.9"/>
      <circle cx="-40" cy="0" r="3" fill="#fff" opacity="0.7"/>
      <circle cx="40" cy="0" r="3" fill="#fff" opacity="0.7"/>
      <circle cx="-35" cy="25" r="3.5" fill="#fff" opacity="0.8"/>
      <circle cx="35" cy="25" r="3.5" fill="#fff" opacity="0.8"/>
    </g>
    
    <path d="M-45,-45 Q-50,-50 -45,-55" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    <path d="M45,-45 Q50,-50 45,-55" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    
    <g opacity="0.3">
      <line x1="-50" y1="-60" x2="-45" y2="-55" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-55" y1="-55" x2="-50" y2="-50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="50" y1="-60" x2="45" y2="-55" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="55" y1="-55" x2="50" y2="-50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  
  <text x="100" y="175" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle" 
        opacity="0.95">
    AI TryOn
