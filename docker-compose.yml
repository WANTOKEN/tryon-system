name: tryon

services:
  db:
    image: mysql:8.4.6
    container_name: tryon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tryon
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tryon-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tryon-backend
    init: true
    # 源码卷 + --reload：改 Python 代码免重建（改依赖/Dockerfile 才需 --build backend）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://tryon:tryon@db:3306/tryon?charset=utf8mb4
      STORAGE_LOCAL_DIR: /app/data/storage
      STORAGE_BACKEND: local
      AI_ENGINE: mock
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      DEV_SMS_ENABLED: "true"
    volumes:
      - ./backend/app:/app/app
      - backend-data:/app/data
    networks:
      - tryon-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: tryon-nginx
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - tryon-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  tryon-net:
    driver: bridge

volumes:
  mysql-data:
  backend-data:
