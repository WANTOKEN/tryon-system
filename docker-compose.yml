name: tryon

services:
  db:
    image: mysql:8.4.6
    container_name: tryon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tryon
    # MySQL 8.4 默认不加载 mysql_native_password 插件；aiomysql 不兼容 caching_sha2_password，
    # 故显式重新启用该插件（8.4 专用参数），使 init.sql 的 IDENTIFIED WITH mysql_native_password 生效。
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tryon-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # backend / nginx 不通过 compose 默认启动，仅本地直接运行即可。
  # 需要一起编排时，去掉下方注释并 `docker compose up -d backend nginx`。
