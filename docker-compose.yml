name: tryon

# ============================================================
# 开发模式：默认只跑 db；backend 与 nginx 平时本地直接启动。
# 上线 / 协作时取消下方注释后执行：docker compose up --build -d
# ============================================================

services:
  db:
    image: mysql:8.4.6
    container_name: tryon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tryon}
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tryon-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ----- 后端 + 网关（按需启用） -----
  # 启用前请先在 .env 写好 JWT_SECRET_KEY、ADMIN_PASSWORD、LAS_API_KEY 等
  backend:
    build: ./backend
    container_name: tryon-backend
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-tryon}:${MYSQL_PASSWORD:-tryon}@db:3306/${MYSQL_DATABASE:-tryon}?charset=utf8mb4
      STORAGE_LOCAL_DIR: /app/data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AI_ENGINE: ${AI_ENGINE:-mock}
      ENV: ${ENV:-development}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEV_SMS_ENABLED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required in production}
      LAS_API_KEY: ${LAS_API_KEY:-}
      LAS_BASE_URL: ${LAS_BASE_URL:-https://operator.las.cn-beijing.volces.com}
      ENGINE_MODEL: ${ENGINE_MODEL:-doubao-seedream-4.5}
      LAS_SIZE: ${LAS_SIZE:-1024x1024}
      LAS_WATERMARK: "false"
      LAS_MAX_REF_IMAGES: "10"
      UPLOAD_MAX_SIZE_MB: "20"
      MOCK_TRYON_SECONDS: "3"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
    volumes:
      - backend-data:/app/data
    networks:
      - tryon-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: tryon-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT_USER:-8080}:8080"
      - "${NGINX_PORT_ADMIN:-8081}:8081"
    networks:
      - tryon-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  tryon-net:
    driver: bridge

volumes:
  mysql-data:
  backend-data:
