# AI 虚拟试衣系统 - 生产环境 Docker Compose
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ===========================================
  # MySQL 8.0 数据库
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: tryon-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tryon_system
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tryon-internal

  # ===========================================
  # Redis 7 缓存服务
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: tryon-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tryon-internal

  # ===========================================
  # Django 后端服务
  # ===========================================
  backend:
    image: tryon-backend:latest
    container_name: tryon-backend
    restart: always
    environment:
      # Django 配置
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DJANGO_ENV: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      
      # 数据库配置
      DB_NAME: tryon_system
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: mysql
      DB_PORT: 3306
      
      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      
      # 存储配置
      STORAGE_TYPE: oss
      
      # 阿里云 OSS 配置
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      
      # AI 引擎配置
      AI_ENGINE_DEFAULT: seeddance
      ARK_API_KEY: ${ARK_API_KEY}
      
      # 后端 URL
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - backend_logs:/app/logs
      - backend_media:/app/media
      - ../keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tryon-internal

  # ===========================================
  # Nginx 反向代理
  # ===========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: tryon-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../frontend-react/dist:/var/www/html:ro
      - ../frontend-admin/dist:/var/www/admin:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - tryon-internal

# ===========================================
# 数据卷
# ===========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_media:
    driver: local
  backend_static:
    driver: local

# ===========================================
# 网络 (内部网络，不暴露到外网)
# ===========================================
networks:
  tryon-internal:
    internal: false
