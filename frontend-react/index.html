<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>AI Virtual Try-on | 智能虚拟试衣</title>
    <meta name="description" content="AI驱动的虚拟试衣系统，让穿搭更简单" />
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI试衣" />
    
    <script>
      // 应用启动前同步主题，避免闪烁
      (function () {
        try {
          var t = localStorage.getItem('aitryon-theme') || 'luxury-gold';
          var m = localStorage.getItem('aitryon-mode') || 'light';
          var el = document.documentElement;
          el.setAttribute('data-theme', t);
          el.classList.toggle('dark', m === 'dark');
          el.style.colorScheme = m === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- 图标 -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <style>
      /* 防止 CSS 加载前 SVG 显示过大 */
      svg { max-width: 24px; max-height: 24px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
