<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#E5C158"/>
      <stop offset="100%" style="stop-color:#B8962E"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2A2A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- 装饰圆环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fff" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff" stroke-width="1" opacity="0.1"/>
  
  <!-- 衣服图标 - 简化的连衣裙 -->
  <g filter="url(#shadow)">
    <!-- 衣服主体 -->
    <path d="M256 100 L310 140 L295 200 L340 380 L256 420 L172 380 L217 200 L202 140 Z" 
          fill="url(#dressGrad)"/>
    
    <!-- 衣服高光 -->
    <path d="M256 100 L280 130 L268 190 L256 200 L244 190 L232 130 Z" 
          fill="#3A3A3A" opacity="0.5"/>
    
    <!-- 领口 -->
    <ellipse cx="256" cy="115" rx="30" ry="15" fill="#D4AF37"/>
    
    <!-- AI 魔法星星 -->
    <g fill="#fff">
      <path d="M380 130 L385 145 L400 150 L385 155 L380 170 L375 155 L360 150 L375 145 Z" opacity="0.9"/>
      <path d="M340 90 L343 100 L353 103 L343 106 L340 116 L337 106 L327 103 L337 100 Z" opacity="0.7"/>
      <path d="M400 180 L402 187 L409 189 L402 191 L400 198 L398 191 L391 189 L398 187 Z" opacity="0.5"/>
    </g>
  </g>
  
  <!-- 底部文字 -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A1A1A" opacity="0.8">AI</text>
</svg>
