# 统一 Nginx 网关配置（开发 / 测试 / 验收）
# 直接托管两个前端静态资源，并将后端接口反向代理到 backend 服务。
# 服务间通过 Docker 内置网络（tryon-net）以服务名互访。

# 全局上传体积上限（用户端/管理后台共用）
client_max_body_size 50m;

# 用户端：http://localhost:8080
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/user;
    index index.html;

    # SPA 路由回退（刷新子路由时不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    # 本地存储上传文件反代
    location /static/uploads/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    # 文件访问（/file/{uuid}/ 等）反代
    location /file/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }
}

# 管理后台：http://localhost:8081
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location /static/uploads/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location /file/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }
}
