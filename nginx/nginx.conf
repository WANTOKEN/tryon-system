# 统一 Nginx 网关配置（开发 / 测试 / 验收 / 生产）
# 直接托管两个前端静态资源，并将后端接口反向代理到 backend 服务。
# 服务间通过 Docker 内置网络（tryon-net）以服务名互访。

# 全局上传体积上限（用户端/管理后台共用）
client_max_body_size 50m;

# 启用 gzip（中文字体/JS/CSS 通常能压缩到原来的 1/3）
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

# 静态资源长缓存（带 hash 文件名已自带指纹）
map $sent_http_content_type $cache_control_header {
    default "";
    "~image/" "public, max-age=2592000";  # 30 天
    "~font/"  "public, max-age=2592000";
    "~text/css$" "public, max-age=604800";   # 7 天
    "~application/javascript$" "public, max-age=604800";
}

# 用户端：http://localhost:8080
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/user;
    index index.html;

    # SPA 路由回退（刷新子路由时不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源走长缓存（hash 文件名已自带指纹）
    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        add_header Cache-Control $cache_control_header;
        expires 30d;
        try_files $uri =404;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    # 本地存储上传文件反代
    location /static/uploads/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    # 文件访问（/file/{uuid}/ 等）反代
    location /file/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    # 健康检查
    location = /health { access_log off; return 200 "ok\n"; }
}

# 管理后台：http://localhost:8081
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        add_header Cache-Control $cache_control_header;
        expires 30d;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location /static/uploads/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location /file/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /health { access_log off; return 200 "ok\n"; }
}
